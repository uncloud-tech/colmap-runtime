# Ruff configuration for this repository.
#
# Derived from the sanecode clean-code harness (spec/01 decision 47): the same
# selected rule families, ignores, and isort behaviour. When sanecode's config
# generator lands, this file should be generated from it rather than hand-edited.
target-version = "py312"
line-length = 88
preview = false

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "PIE", "PTH", "SIM", "RUF", "RET", "PERF", "N"]
ignore = ["E501"]

[lint.isort]
force-sort-within-sections = true

[lint.per-file-ignores]
"tests/*" = ["F401"]
