name: Build dev image (PR#8 memory stack)

# TEMPORARY dev build, kept entirely separate from the production pipeline:
# its own concurrency group, cache ref and image package. CPU-validated only —
# nvcc/cmake run without a GPU, so this proves the tree compiles and which CUDA
# targets are emitted, NOT that the kernels run on hardware.
on:
  workflow_dispatch:
    inputs:
      specialization:
        description: Existing dev flow or private runtime specialization
        type: choice
        options: [dev, benchmark]
        default: dev
      private_stage:
        description: Non-sensitive ACL check first; private inputs only after that succeeds
        type: choice
        options: [acl-check, base, cap]
        default: acl-check
      context_sha256:
        description: SHA256 of bounded private gzip context (never secret contents)
        type: string
      package_probe_digest:
        description: Previously verified non-sensitive private package manifest digest
        type: string
      publish:
        description: Publish disposable experimental image (approved header exception; no production data)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: colmap-dev-build
  cancel-in-progress: false

jobs:
  r570:
    if: github.ref == 'refs/heads/ci/r570-cuda128-dev-image' && inputs.specialization != 'benchmark'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-r570.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
  build:
    if: github.ref != 'refs/heads/ci/r570-cuda128-dev-image' && inputs.specialization != 'benchmark'
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Blacksmith BuildKit builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          # Do not share the production runtime's sticky cache.
          cache-key: ${{ github.repository }}/dev
          buildx-version: v0.37.2
          platforms: linux/amd64
          nofallback: true
      - name: Log in to GHCR for build-cache access
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
      - name: Build dev image (exact PR#8 tree)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cache_ref="ghcr.io/${GITHUB_REPOSITORY,,}-dev-buildcache:buildcache"
          docker buildx build --load --pull --platform linux/amd64 --progress=plain \
            --provenance=false --sbom=false \
            --cache-from "type=registry,ref=$cache_ref" \
            --cache-to "type=registry,ref=$cache_ref,mode=max" \
            --tag colmap-dev:pr8 dev 2>&1 | tee reports/build.log
          ( grep -c 'CACHED' reports/build.log || true ) > reports/cache-hits.txt
      - name: Collect installed dependencies and run selected CPU test offline
        shell: bash
        run: |
          set -euo pipefail
          # Verification is external to the cached dependency/kernel image recipe.
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,source=$PWD/scripts/collect_dev_evidence.sh,target=/verification.sh,readonly" \
            --mount "type=bind,source=$PWD/reports,target=/evidence" \
            colmap-dev:pr8 /verification.sh 2>&1 | tee reports/verification.log
      - name: Require baked binary identity and runtime defaults
        run: python3 scripts/check_dev_contract.py reports
      - name: Require per-MVS-kernel sm89 SASS and compute90 PTX
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_dev_targets.py reports 2>&1 | tee reports/targets.log
      - name: Capture build/architecture and committed-repo evidence
        shell: bash
        run: |
          set -euo pipefail
          cat reports/BUILD-MANIFEST.txt
          docker image inspect colmap-dev:pr8 --format '{{.Id}}' > reports/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > reports/workflow-commit.txt
          git ls-files dev .github/workflows/build-dev.yml scripts/collect_dev_evidence.sh scripts/check_dev_contract.py scripts/check_dev_targets.py scripts/check_dev_security.py > reports/dev-files.txt
          git log -1 --format=%H -- dev > reports/image-recipe-last-change.txt
          sha256sum dev/Dockerfile dev/*.sh scripts/collect_dev_evidence.sh scripts/check_dev_contract.py scripts/check_dev_targets.py scripts/check_dev_security.py > reports/recipe-verifier-sha256.txt
          cat reports/dev-files.txt
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: colmap-dev:pr8
          format: cyclonedx
          output: reports/sbom.cdx.json
          timeout: 10m
          cache: false
      - name: Require dev security policy (explicit header-only exception)
        shell: bash
        run: |
          set -euo pipefail
          trivy image --scanners vuln --format json --timeout 10m \
            --output reports/vulnerabilities.json colmap-dev:pr8
          python3 scripts/check_dev_security.py reports/vulnerabilities.json reports/BUILD-MANIFEST.txt > reports/security-gate.json 2> reports/security-gate-errors.txt
          (cd reports && sha256sum *.json *.txt *.log > SHA256SUMS)
      - name: Publish experimental dev image
        if: inputs.publish
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-dev"
          tag="$repository:pr8-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          export DOCKER_CONFIG="$config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          test "$(docker image inspect --format '{{.Id}}' colmap-dev:pr8)" = "$(cat reports/image-id.txt)"
          docker tag colmap-dev:pr8 "$tag"
          docker push "$tag"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          case "$reference" in "$repository"@sha256:*) ;; *) echo 'Unexpected published reference' >&2; exit 1;; esac
          printf '%s\n' "$reference" | tee reports/published-image.txt
          (cd reports && sha256sum *.json *.txt *.log > SHA256SUMS)
      - name: Hash evidence even after failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d reports ]; then
            (cd reports && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          fi
      - name: Retain evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-dev-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
  specialization:
    if: inputs.specialization == 'benchmark' && github.ref == 'refs/heads/ci/benchmark-specialization'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: ${{ inputs.private_stage == 'base' && 15 || 5 }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Ephemeral local builder, NOT Blacksmith's paid sticky-cache action.
      # Live stable action4.4.1/BuildKit0.34.0 verified official2026-10-16;
      # Buildx0.37.2 is the existing project's reproducibility pin.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.37.2
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          cache-binary: false
      - name: Private registry authentication (no persisted checkout credentials)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          test '${{ runner.environment }}' = self-hosted
          export DOCKER_CONFIG="$RUNNER_TEMP/registry-auth"
          mkdir -m700 "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
      - name: Non-sensitive PRIVATE package ACL preflight only
        if: inputs.private_stage == 'acl-check'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +x
          set -euo pipefail
          mkdir "$RUNNER_TEMP/probe"
          printf 'FROM scratch\nLABEL org.opencontainers.image.source="https://github.com/uncloud-tech/colmap-runtime"\n' > "$RUNNER_TEMP/probe/Dockerfile"
          docker buildx build --provenance=false --platform linux/amd64 --push --tag "ghcr.io/uncloud-tech/colmap-calibration-private:acl-$GITHUB_RUN_ID" --metadata-file "$RUNNER_TEMP/probe.json" "$RUNNER_TEMP/probe" >"$RUNNER_TEMP/probe.log" 2>&1
          digest=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/probe.json")
          python3 scripts/private_build_input.py registry-check "$digest"
          printf 'Private ACL/authorized-read/anonymous-denial passed: %s\n' "$digest"
      - name: Refuse unreviewed JIT stage
        if: inputs.private_stage == 'cap'
        run: exit 2 # reviewed base FIRST; JIT workflow surface follows separately
      - name: Verify PRIVATE package before unpacking sensitive source
        if: inputs.private_stage == 'base'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROBE_DIGEST: ${{ inputs.package_probe_digest }}
        run: python3 scripts/private_build_input.py registry-check "$PROBE_DIGEST"
      - name: Bounded private source input (never logged or published as CI artifact)
        if: inputs.private_stage == 'base'
        env:
          PRIVATE_CONTEXT_1: ${{ secrets.COLMAP_PRIVATE_CONTEXT_1 }}
          PRIVATE_CONTEXT_2: ${{ secrets.COLMAP_PRIVATE_CONTEXT_2 }}
          CONTEXT_SHA256: ${{ inputs.context_sha256 }}
        run: python3 scripts/private_build_input.py unpack "$CONTEXT_SHA256" "$RUNNER_TEMP/private-context"
      - name: Build and CPU-gate only the specialization; no GPU/guest execution
        if: inputs.private_stage == 'base'
        shell: bash
        run: |
          set +x
          set -euo pipefail
          log="$RUNNER_TEMP/private-build.log"
          if ! bash -euo pipefail >"$log" 2>&1 <<'PRIVATE_BUILD'
            printf build > "$RUNNER_TEMP/private-stage"
            docker buildx build --target payload-base --platform linux/amd64 --provenance=false --sbom=false --load --output "type=oci,dest=$RUNNER_TEMP/private-base.oci.tar,compression=gzip" --tag private-base:one "$RUNNER_TEMP/private-context"
            printf oci > "$RUNNER_TEMP/private-stage"
            python3 scripts/private_build_input.py oci-check "$RUNNER_TEMP/private-base.oci.tar" "$RUNNER_TEMP/verified-oci" > "$RUNNER_TEMP/oci-binding.json"
            config=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["config_digest"])' "$RUNNER_TEMP/oci-binding.json")
            test "$(docker image inspect private-base:one --format '{{.Id}}')" = "$config"
            # Existing legacy native bytes/interface, plus only new sender dependencies.
            # No source320 build, host-cgroup requirement or GPU execution here.
            printf cpu > "$RUNNER_TEMP/private-stage"
            docker run --rm --network none --entrypoint /opt/colmap-runtime/python/bin/python3.14 private-base:one /opt/benchmark-transport/verify_image.py > "$RUNNER_TEMP/cpu-doctor.json"
            # Actual expanded image layers (not a compressed-size/free-disk proxy).
            docker image inspect private-base:one --format '{{.Size}}' > "$RUNNER_TEMP/expanded-image-bytes"
            printf publish > "$RUNNER_TEMP/private-stage"
            tag="ghcr.io/uncloud-tech/colmap-calibration-private:base-$GITHUB_RUN_ID"
            # Push the measured immutable OCI layout, NOT daemon-recompressed --load bytes.
            mkdir "$RUNNER_TEMP/frozen-publish"
            printf 'FROM frozen\n' > "$RUNNER_TEMP/frozen-publish/Dockerfile"
            manifest=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["manifest_digest"])' "$RUNNER_TEMP/oci-binding.json")
            docker buildx build --platform linux/amd64 --provenance=false --sbom=false --build-context "frozen=oci-layout://$RUNNER_TEMP/verified-oci@$manifest" --output "type=image,name=$tag,push=true,oci-mediatypes=true,compression=gzip,force-compression=false" --metadata-file "$RUNNER_TEMP/published.json" "$RUNNER_TEMP/frozen-publish"
            published=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/published.json")
            test "$published" = "$manifest"
            printf '%s@%s\n' "ghcr.io/uncloud-tech/colmap-calibration-private" "$published" > "$RUNNER_TEMP/base-reference.txt"
          PRIVATE_BUILD
          then
            if [[ -f "$RUNNER_TEMP/private-stage" ]]; then stage=$(<"$RUNNER_TEMP/private-stage"); else stage=unknown; fi
            case "$stage" in build|oci|cpu|publish) ;; *) stage=unknown ;; esac
            printf '{"stage":"%s","status":"failed","code":"PRIVATE_BUILD_GATE_FAILED"}\n' "$stage"
            exit 1
          fi
          python3 scripts/private_build_input.py proof "$RUNNER_TEMP/cpu-doctor.json" "$RUNNER_TEMP/expanded-image-bytes" "$RUNNER_TEMP/published.json"
      - name: Remove ephemeral sensitive workspace and registry auth
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- "$RUNNER_TEMP/private-context" "$RUNNER_TEMP/registry-auth"
