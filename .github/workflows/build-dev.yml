name: Build dev image (PR#8 memory stack)

# TEMPORARY dev build, kept entirely separate from the production pipeline:
# its own concurrency group, cache ref and image package. CPU-validated only —
# nvcc/cmake run without a GPU, so this proves the tree compiles and which CUDA
# targets are emitted, NOT that the kernels run on hardware.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish disposable experimental image (approved header exception; no production data)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: colmap-dev-build
  cancel-in-progress: false

jobs:
  r570:
    if: github.ref == 'refs/heads/ci/r570-cuda128-dev-image'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-r570.yml
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
  build:
    if: github.ref != 'refs/heads/ci/r570-cuda128-dev-image'
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Blacksmith BuildKit builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          # Do not share the production runtime's sticky cache.
          cache-key: ${{ github.repository }}/dev
          buildx-version: v0.37.2
          platforms: linux/amd64
          nofallback: true
      - name: Log in to GHCR for build-cache access
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
      - name: Build dev image (exact PR#8 tree)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cache_ref="ghcr.io/${GITHUB_REPOSITORY,,}-dev-buildcache:buildcache"
          docker buildx build --load --pull --platform linux/amd64 --progress=plain \
            --provenance=false --sbom=false \
            --cache-from "type=registry,ref=$cache_ref" \
            --cache-to "type=registry,ref=$cache_ref,mode=max" \
            --tag colmap-dev:pr8 dev 2>&1 | tee reports/build.log
          ( grep -c 'CACHED' reports/build.log || true ) > reports/cache-hits.txt
      - name: Collect installed dependencies and run selected CPU test offline
        shell: bash
        run: |
          set -euo pipefail
          # Verification is external to the cached dependency/kernel image recipe.
          docker run --rm --network none --entrypoint bash \
            --mount "type=bind,source=$PWD/scripts/collect_dev_evidence.sh,target=/verification.sh,readonly" \
            --mount "type=bind,source=$PWD/reports,target=/evidence" \
            colmap-dev:pr8 /verification.sh 2>&1 | tee reports/verification.log
      - name: Require baked binary identity and runtime defaults
        run: python3 scripts/check_dev_contract.py reports
      - name: Require per-MVS-kernel sm89 SASS and compute90 PTX
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_dev_targets.py reports 2>&1 | tee reports/targets.log
      - name: Capture build/architecture and committed-repo evidence
        shell: bash
        run: |
          set -euo pipefail
          cat reports/BUILD-MANIFEST.txt
          docker image inspect colmap-dev:pr8 --format '{{.Id}}' > reports/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > reports/workflow-commit.txt
          git ls-files dev .github/workflows/build-dev.yml scripts/collect_dev_evidence.sh scripts/check_dev_contract.py scripts/check_dev_targets.py scripts/check_dev_security.py > reports/dev-files.txt
          git log -1 --format=%H -- dev > reports/image-recipe-last-change.txt
          sha256sum dev/Dockerfile dev/*.sh scripts/collect_dev_evidence.sh scripts/check_dev_contract.py scripts/check_dev_targets.py scripts/check_dev_security.py > reports/recipe-verifier-sha256.txt
          cat reports/dev-files.txt
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: colmap-dev:pr8
          format: cyclonedx
          output: reports/sbom.cdx.json
          timeout: 10m
          cache: false
      - name: Require dev security policy (explicit header-only exception)
        shell: bash
        run: |
          set -euo pipefail
          trivy image --scanners vuln --format json --timeout 10m \
            --output reports/vulnerabilities.json colmap-dev:pr8
          python3 scripts/check_dev_security.py reports/vulnerabilities.json reports/BUILD-MANIFEST.txt > reports/security-gate.json 2> reports/security-gate-errors.txt
          (cd reports && sha256sum *.json *.txt *.log > SHA256SUMS)
      - name: Publish experimental dev image
        if: inputs.publish
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-dev"
          tag="$repository:pr8-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config=$(mktemp -d)
          trap 'rm -rf "$config"' EXIT
          export DOCKER_CONFIG="$config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          test "$(docker image inspect --format '{{.Id}}' colmap-dev:pr8)" = "$(cat reports/image-id.txt)"
          docker tag colmap-dev:pr8 "$tag"
          docker push "$tag"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          case "$reference" in "$repository"@sha256:*) ;; *) echo 'Unexpected published reference' >&2; exit 1;; esac
          printf '%s\n' "$reference" | tee reports/published-image.txt
          (cd reports && sha256sum *.json *.txt *.log > SHA256SUMS)
      - name: Hash evidence even after failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d reports ]; then
            (cd reports && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS)
          fi
      - name: Retain evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-evidence-dev-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
