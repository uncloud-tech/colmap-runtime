name: Build runtime candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publication is gated until CPU, licence and layer review pass
        type: boolean
        default: false
      accept_redistribution_terms:
        description: Publisher has reviewed and accepts applicable third-party redistribution conditions
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: colmap-runtime-build
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # The benchmark-v4 pycolmap-builder stage compiles COLMAP from source for
    # sm_70/75/86/89/120 with CUDA, so the CPU-only build takes far longer than
    # the previous wheel-install image.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publication terms gate
        if: inputs.publish
        env:
          ACCEPT_TERMS: ${{ inputs.accept_redistribution_terms }}
        run: |
          if [ "$ACCEPT_TERMS" != true ]; then
            echo 'Publisher must review and accept third-party redistribution conditions.' >&2
            exit 1
          fi
      - name: Test build contract
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
      - name: Set up Blacksmith BuildKit builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0
        with:
          # Isolate sticky cache from the temporary dev toolchain image.
          cache-key: ${{ github.repository }}/runtime
          buildx-version: v0.37.2
          platforms: linux/amd64
          # Fail visibly instead of silently benchmarking a fallback builder.
          nofallback: true
      - name: Log in to GHCR for build-cache access
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
      - name: Build CPU-validated candidate
        shell: bash
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mkdir -p reports
          printf '%s' 'BUILD_CONTEXT_EXCLUSION_CANARY' > image/.env.canary
          apt_refresh="$(date -u +%G-W%V)"
          # A separate, public cache package (Docker's documented :buildcache
          # pattern) keeps the deployable image package's tags and lifecycle
          # independent of the frequently-rewritten build cache.
          cache_ref="ghcr.io/${GITHUB_REPOSITORY,,}-buildcache:buildcache"
          # --provenance/--sbom are disabled so the loaded image remains a
          # single-manifest archive that scripts/audit_image.py accepts.
          # --load (not a build-time publish) keeps publication behind the
          # security gate.
          # Publishing adds --no-cache so the shipped image re-resolves Ubuntu
          # security updates instead of reusing a possibly-stale cached layer.
          args=(--load --pull --platform linux/amd64 --progress=plain
                --provenance=false --sbom=false
                --cache-from "type=registry,ref=$cache_ref"
                --cache-to "type=registry,ref=$cache_ref,mode=max"
                --build-arg "APT_REFRESH=$apt_refresh"
                --tag colmap-runtime:candidate)
          if [ "$PUBLISH" = "true" ]; then args+=(--no-cache); fi
          docker buildx build "${args[@]}" image 2>&1 | tee reports/build.log
          # Cache-visibility evidence (non-fatal): silent cache degradation must
          # be observable rather than inferred from wall-clock.
          printf 'cache_ref=%s\npublish=%s\napt_refresh=%s\n' \
            "$cache_ref" "$PUBLISH" "$apt_refresh" > reports/cache-mode.txt
          ( grep -c 'CACHED' reports/build.log || true ) > reports/cache-hits.txt
          docker buildx inspect --bootstrap > reports/buildx-inspect.txt 2>&1 || true
          docker image inspect colmap-runtime:candidate | python3 scripts/public_metadata.py > reports/image-inspect.json
          docker history --no-trunc colmap-runtime:candidate > reports/image-history.txt
          cid=$(docker create colmap-runtime:candidate)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for file in runtime-manifest.json runtime-lock.json system-packages.txt python-packages.txt; do
            docker cp "$cid:/opt/colmap-runtime/$file" "reports/$file"
          done
          docker run --rm --network none --entrypoint python3.14 colmap-runtime:candidate \
            /opt/colmap-runtime/verify_runtime.py --mode cpu --require-installer-free --output /tmp/cpu-check.json \
            | tee reports/offline-import-check.json
      - name: Exercise exact native API on CPU before GPU testing
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none \
            --mount "type=bind,source=$PWD/scripts/synthetic_canary.py,target=/tmp/synthetic_canary.py,readonly" \
            --entrypoint python3.14 colmap-runtime:candidate \
            /tmp/synthetic_canary.py --check-api --output /tmp/api-check \
            2>&1 | tee reports/api-preflight.log
      - name: Audit all layers and context exclusion
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/colmap-candidate.tar"
          trap 'rm -f "$archive"' EXIT
          docker save colmap-runtime:candidate -o "$archive"
          python3 scripts/audit_image.py "$archive" | tee reports/layer-audit.json
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: colmap-runtime:candidate
          format: cyclonedx
          output: reports/sbom.cdx.json
          timeout: 10m
          cache: false
      - name: Record vulnerability findings without silently accepting them
        shell: bash
        run: |
          set -euo pipefail
          trivy image --scanners vuln --format json --timeout 10m \
            --output reports/vulnerabilities.json colmap-runtime:candidate
          docker image inspect --format '{{.Id}}' colmap-runtime:candidate > reports/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > reports/source-commit.txt
          python3 scripts/check_security.py reports/vulnerabilities.json > reports/security-gate.json
          (cd reports && sha256sum *.json *.txt *.log > SHA256SUMS)
      - name: Publish inspected GPU-unvalidated candidate
        if: inputs.publish
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$repository:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          config=$(mktemp -d)
          anonymous=$(mktemp -d)
          trap 'rm -rf "$config" "$anonymous"' EXIT
          export DOCKER_CONFIG="$config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          unset REGISTRY_TOKEN
          expected=$(cat reports/image-id.txt)
          test "$(docker image inspect --format '{{.Id}}' colmap-runtime:candidate)" = "$expected"
          docker tag colmap-runtime:candidate "$tag"
          docker push "$tag"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$tag")
          case "$reference" in "$repository"@sha256:*) ;; *) echo 'Unexpected published reference' >&2; exit 1;; esac
          printf '%s\n' "$reference" > reports/published-image.txt
          # New GHCR packages may require the owner to enable public visibility.
          # A private push must never be reported as anonymously deployable.
          docker --config "$anonymous" manifest inspect "$reference" > reports/anonymous-manifest.json
          docker --config "$anonymous" pull "$reference"
          test "$(docker image inspect --format '{{.Id}}' "$reference")" = "$expected"
          docker run --rm --network none --entrypoint python3.14 "$reference" \
            /opt/colmap-runtime/verify_runtime.py --mode cpu --require-installer-free --output /tmp/published-check.json \
            | tee reports/published-import-check.json
          (cd reports && sha256sum *.json *.txt *.log > SHA256SUMS)
      - name: Retain evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-evidence-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
